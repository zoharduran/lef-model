name: IndexNow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sitemap.xml']
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 - <<'PY'
          import re, json, urllib.request
          urls = re.findall(r'<loc>([^<]+)</loc>', open('sitemap.xml').read())
          key = 'ada616c79a5a4a92bb9a005ff898ee42'
          body = json.dumps({"host": "lef-model.com", "key": key,
                             "keyLocation": f"https://lef-model.com/{key}.txt",
                             "urlList": urls}).encode()
          for ep in ["https://api.indexnow.org/indexnow", "https://www.bing.com/indexnow", "https://yandex.com/indexnow"]:
              req = urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  r = urllib.request.urlopen(req, timeout=60); print(ep, r.status, len(urls))
              except Exception as e:
                  print(ep, "ERR", e)
          PY
